version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      vite:
        patterns:
          - vite
          - "@vitejs/*"
      eslint:
        patterns:
          - eslint
          - "@eslint/*"
          - "eslint-plugin-*"
          - typescript-eslint
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      playwright:
        patterns: [playwright, "@playwright/test"]
      eslint:
        patterns: [eslint, "@eslint/*", typescript-eslint]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      astro:
        patterns: [astro, "@astrojs/*"]
    labels: [dependencies]

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, github-actions]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, docker]

  - package-ecosystem: docker
    directory: /e2e
    schedule:
      interval: weekly
    labels: [dependencies, docker]
