name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ github.ref_type == 'tag' || steps.filter.outputs.app == 'true' }}
      browser: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.app == 'true' || steps.filter.outputs.browser == 'true' }}
      docs: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.docs == 'true' }}
      validate: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.app == 'true' || steps.filter.outputs.shared == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.ref_type != 'tag'
        with:
          predicate-quantifier: every
          filters: |
            app:
              - '{backend/**,web/**,config/**,assets/**,Dockerfile,.dockerignore,docker-compose.yaml}'
              - '!backend/e2e/**'
              - '!**/*.md'
            browser:
              - '{backend/e2e/**,e2e/**,screenshots/**,Makefile,.golangci.yml,.prettierignore,.github/workflows/{ci,ui-tests}.yml}'
            shared:
              - '{Makefile,.golangci.yml,.prettierignore,.github/workflows/ci.yml}'
            docs:
              - '{docs/**,screenshots/**,assets/**,Makefile,.prettierignore,.github/workflows/{ci,pages}.yml}'

      - name: Validate release tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          number='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          [[ "$TAG" =~ ^v${number}\.${number}\.${number}(-${identifier}(\.${identifier})*)?$ ]] || {
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH with an optional valid SemVer prerelease"
            exit 1
          }

  validate:
    needs: changes
    if: needs.changes.outputs.validate == 'true'
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: make dependencies-backend dependencies-frontend

      - run: make check

  ui:
    name: Browser tests
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    uses: ./.github/workflows/ui-tests.yml

  docker:
    name: Publish image and release
    runs-on: ubuntu-latest
    needs: [changes, ci-result]
    if: >-
      always() && github.event_name == 'push' &&
      needs.ci-result.result == 'success' && needs.changes.outputs.app == 'true'
    permissions:
      contents: write
      packages: write
    concurrency:
      group: runtime-publishing-${{ github.ref_type }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select release aliases
        id: aliases
        env:
          TAG: ${{ github.ref_name }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          latest=false
          major=false
          minor=false
          prerelease=false
          if [[ "$IS_TAG" == true ]]; then
            if [[ "$TAG" == *-* ]]; then
              prerelease=true
            else
              # Refresh while holding the publishing lock so backports and reruns
              # cannot move stable aliases behind a newer release tag.
              git fetch origin --tags
              stable_tags=$(git tag --list | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$')
              major_prefix=${TAG%.*.*}
              minor_prefix=${TAG%.*}
              [[ "$TAG" != "$(printf '%s\n' "$stable_tags" | sort -V | tail -1)" ]] || latest=true
              [[ "$TAG" != "$(printf '%s\n' "$stable_tags" | grep -E "^${major_prefix}\." | sort -V | tail -1)" ]] || major=true
              [[ "$TAG" != "$(printf '%s\n' "$stable_tags" | grep -F "$minor_prefix." | grep -E "^${major_prefix}\." | sort -V | tail -1)" ]] || minor=true
            fi
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "minor=$minor" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ steps.aliases.outputs.latest == 'true' }}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ steps.aliases.outputs.minor == 'true' }}
            type=semver,pattern=v{{major}},enable=${{ steps.aliases.outputs.major == 'true' }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            APP_VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: orhun/git-cliff-action@v4
        if: github.ref_type == 'tag'
        id: cliff
        with:
          config: cliff.toml
          args: --current --strip header

      - uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          body: ${{ steps.cliff.outputs.content }}
          prerelease: ${{ steps.aliases.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.aliases.outputs.latest }}

  formatting:
    name: Shared formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make dependencies-frontend format-check-frontend format-check-shared

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      deploy: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

  ci-result:
    name: CI result
    if: always()
    needs: [changes, validate, ui, docs, formatting]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected checks to pass
        env:
          FAILED: ${{ needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false
