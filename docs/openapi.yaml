openapi: 3.1.0
info:
  title: CertVault API
  version: 1.0.0
servers:
  - url: /api/v1
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
  schemas:
    Problem:
      type: object
      properties:
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
security: [{apiKey: []}]
paths:
  /health:
    get:
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: {type: string, const: ok}
                  version: {type: string}
  /certificates:
    get:
      summary: List certificates visible to the caller
      responses: {"200": {description: Certificate list}, "401": {description: Unauthorized}}
  /certificates/{name}:
    get:
      summary: Inspect a certificate
      parameters: [{name: name, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: Certificate metadata}, "404": {description: Not found}}
  /certificates/{name}/fullchain.crt:
    get:
      summary: Download the current full chain
      parameters: [{name: name, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: PEM full chain}}
  /certificates/{name}/private.key:
    get:
      summary: Download the decrypted current private key
      parameters: [{name: name, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: PEM private key}, "403": {description: Missing private_keys:read}}
  /certificates/{name}/renew:
    post:
      summary: Queue a renewal
      parameters: [{name: name, in: path, required: true, schema: {type: string}}]
      responses: {"202": {description: Queued}}
  /acme-accounts:
    get:
      summary: List ACME accounts
      responses: {"200": {description: ACME account list}, "403": {description: Administrator access required}}
  /acme-accounts/{id}:
    delete:
      summary: Delete a non-current ACME account
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "204": {description: Deleted}
        "403": {description: Administrator access required}
        "404": {description: ACME account not found}
        "409": {description: Current ACME accounts cannot be deleted}
